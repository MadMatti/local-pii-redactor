[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-pii-redactor"
version = "0.1.0"
description = "Local PII extraction and deterministic redaction with Qwen3-1.7B"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic==2.13.4",
]

[project.optional-dependencies]
data = [
    "datasets==5.0.1",
    "huggingface-hub==1.29.0",
    "numpy==2.4.6",
    "pandas==3.0.5",
    "tqdm==4.70.0",
    "transformers==5.16.1",
]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "network: requires internet access and downloads remote data",
    "mlx: requires Apple Metal access and MLX",
]
